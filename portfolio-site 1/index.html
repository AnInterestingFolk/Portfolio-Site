<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфоліо Нікіти</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>

  <header>
    <h1>Моє портфоліо</h1>
    <nav>
      <a href="#about">Про мене</a>
      <a href="#portfolio">Роботи</a>
      <a href="#contacts">Контакти</a>
    </nav>
  </header>

  <div class="layout">
    <main>
      <section id="about">
        <h2>Про мене</h2>
        <p>Привіт! Я фотограф та графічний дизайнер. Займаюсь фотозйомкою, створюю логотипи та ілюстрації.</p>
      </section>

<section id="portfolio">
        <h2>Роботи</h2>
        <!-- Filter for category (Event: change) -->
        <div style="margin-bottom: 20px;">
          <label for="category-filter" style="font-weight: 500;">Фільтр за Категорією: </label>
          <select id="category-filter">
            <option value="all">Усі Категорії</option>
            <option value="photography">Фото</option>
            <option value="design">Дезайн</option>
          </select>
        </div>

        <!-- Form for adding new projects (Event: submit) -->
        <form id="add-project-form" style="background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 30px;">
          <h3 style="margin-top: 0;">Додати Новий Проект</h3>
          
          <label for="title-input">Назва:</label>
          <input type="text" id="title-input" required style="margin-right: 15px;">

          <label for="year-input">Рік:</label>
          <input type="number" id="year-input" required min="2000" style="margin-right: 15px;">

          <label for="category-input">Категорія:</label>
          <select id="category-input" required style="margin-right: 15px;">
            <option value="photography">Фото</option>
            <option value="design">Дезайн</option>
          </select>

          <button type="submit" style="padding: 5px 15px;">Додати Проект</button>
        </form>
        <!-- Element for the summary requirement -->
        <p id="projects-count">Кількість робіт: 0</p>
        
        <!-- Container for dynamic rendering -->
        <div id="gallery" class="cards">
        </div>
      </section>

    <aside>
      <h3>Мої навички</h3>
      <ul>
        <li>HTML5 & CSS3</li>
        <li>Figma</li>
      </ul>
    </aside>
  </div>

  <footer id="contacts">
    <h2>Контакти</h2>
    <p>Email: email@example.com</p>
    <p>Мережі: <a href="https://github.com/AnInterestingFolk/">Github</a></p>
    <p>&copy; 2026</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
